<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSHT 消息操作 · 预览版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#dce5ef;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:900px;margin:40px auto;padding:0 22px}h1{font-size:25px;margin:0}small,.note{color:#91a1b5}.banner{border:1px solid #3c5269;background:#192535;border-radius:12px;padding:16px;margin:20px 0 30px}.message{margin:22px 0;padding:20px;border:1px solid #2e3a4b;border-radius:14px;background:#171f2b}.user{margin-left:15%;background:#1c2d3c}.role{font-size:13px;color:#94a9be;margin-bottom:8px}.toolbar{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}button{background:#26374a;border:1px solid #486078;border-radius:7px;padding:5px 13px;color:#e0eaf3;cursor:pointer;font:inherit;font-size:14px}button:hover{background:#375069}button:disabled{opacity:.4;cursor:default}.danger{border-color:#8b5a5a;color:#edbaba}textarea{width:100%;min-height:130px;background:#10151d;color:#dce5ef;padding:12px;font:inherit;border:1px solid #6e93b3;border-radius:8px}#notice{position:sticky;bottom:15px;background:#294d47;border-radius:10px;padding:12px;display:none}a{color:#96c7ee}</style>
<main><h1>DSHT 消息操作 · 0.2 预览版</h1><small>RP 风格按钮 / 历史正文编辑 / 最新轮分支 / 指定轮次回退 / 删除本轮</small>
<div class="banner">这是交互演示，使用插件本身注册的按钮，不连接真实存档。实际“删除本轮”需要完整安装 SQLite V2 后端；原版 DSHT 中该按钮会禁用。</div><div id="messages"></div><div id="notice" role="status"></div>
<p class="note">历史编辑保留后续剧情；回退到此轮保留所选轮，删除其后剧情。实际回退不能撤销。独立分支和已导出的旧备份保留。</p><button id="reset">重置演示</button></main>
<dialog id="confirm-dialog" style="max-width:480px;border:1px solid #486078;border-radius:12px;background:#1c2d3c;color:#dce5ef;padding:24px"><p>删除本轮输入与回复？</p><p>这是可重置的演示。实际 SQLite 删除还会清理对应历史和撤销记录，不能撤销。</p><button id="confirm-yes">确认删除演示轮次</button> <button id="confirm-no">取消</button></dialog><script>const registrations=[];window.__ModuleLoader__={load(module){module.factory().apply({tavernUi:{messageOperationsVersion:1,registerMessageAction(action){registrations.push(action)}}})}};</script><script src="client.js"></script>
<script>
const seed=[{role:'user',turn:2,text:'我推开酒馆的门，看看里面有什么人。'},{role:'assistant',turn:2,text:'炉火映着木桌，靠窗的旅人抬起头，将一封信轻轻推到你面前。'},{role:'user',turn:3,text:'我坐下来，问他信是谁留下的。'},{role:'assistant',turn:3,text:'“有人等你很久了。”旅人指向信封上的蓝色印记，窗外传来一阵急促的马蹄声。'}];let messages=structuredClone(seed);
function notice(text){const n=document.querySelector('#notice');n.textContent=text;n.style.display='block';}
function askDelete(message){document.querySelector("#confirm-dialog p").textContent=message||"删除本轮输入与回复？";return new Promise(resolve=>{const dialog=document.querySelector("#confirm-dialog");const done=value=>{dialog.close();resolve(value);};document.querySelector("#confirm-yes").onclick=()=>done(true);document.querySelector("#confirm-no").onclick=()=>done(false);dialog.oncancel=event=>{event.preventDefault();done(false);};dialog.showModal();});}function draw(){const root=document.querySelector('#messages');root.replaceChildren();const latest=Math.max(...messages.map(m=>m.turn));for(const m of messages){const row=document.createElement('article');row.className='message '+m.role;const label=document.createElement('div');label.className='role';label.textContent=(m.role==='user'?'你':'角色回复')+' · 第 '+m.turn+' 轮';const body=document.createElement('div');body.textContent=m.text;const toolbar=document.createElement('div');toolbar.className='toolbar';row.append(label,body,toolbar);root.append(row);
const context={turn:m.turn,canRollback:m.turn<latest,role:m.role,latest:m.turn===latest,canFork:m.role==='assistant',canForkNow:m.role==='assistant'&&m.turn===latest,forkReason:'预览仅演示最新轮次分支',canEdit:true,canDelete:true,deleteReason:'',
copy:async()=>{try{await navigator.clipboard.writeText(m.text);notice('已复制正文');}catch{notice('浏览器未允许剪贴板；实际插件使用 DSHT 的剪贴板接口。');}},
fork:()=>notice('演示：将从第 '+m.turn+' 轮创建独立分支。实际 SQLite 插件复制完整存档创建独立分支。'),
edit:()=>{body.replaceChildren();const input=document.createElement('textarea');input.value=m.text;const save=document.createElement('button');save.textContent='保存演示正文';save.onclick=()=>{m.text=input.value;draw();notice('演示正文已更新。');};body.append(input,save);input.focus();},
rollbackTo:async()=>{if(await askDelete("保留第 "+m.turn+" 轮，删除后续演示剧情？")){messages=messages.filter(item=>item.turn<=m.turn);draw();notice("演示已保留所选轮，移除后续剧情。");}},
remove:async()=>{if(await askDelete()){messages=messages.filter(item=>item.turn<m.turn);draw();notice('演示已移除本轮；未操作任何真实存档。');}}};
for(const action of registrations){if(!action.roles.includes(m.role)||(action.when&&!action.when(context)))continue;const button=document.createElement('button');button.textContent=action.label;button.disabled=!!(action.disabled&&action.disabled(context));button.title=action.title?action.title(context):action.label;if(action.id==='rp-delete')button.className='danger';button.onclick=async()=>{button.disabled=true;try{await action.run(context);}catch(e){notice(e.message);}finally{button.disabled=false;}};toolbar.append(button);}}}
document.querySelector('#reset').onclick=()=>{messages=structuredClone(seed);draw();document.querySelector('#notice').style.display='none';};draw();
</script></html>
